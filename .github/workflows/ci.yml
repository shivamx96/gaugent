name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: swift test
      - name: Build universal app bundle
        run: scripts/build-app.sh release
      - name: Verify both architectures
        run: |
          architectures=$(lipo -archs build/gaugent.app/Contents/MacOS/Gaugent)
          for arch in arm64 x86_64; do
            [[ " $architectures " == *" $arch "* ]] || exit 1
          done
      - name: Test release validation
        run: python3 -m unittest discover -s Tests
      - name: Package local release candidate
        env:
          GAUGENT_SIGNING_IDENTITY: '-'
          GAUGENT_ALLOW_ADHOC: '1'
          GAUGENT_SKIP_NOTARIZATION: '1'
        run: scripts/release.sh 0.0.0-ci 1
      - name: Verify candidate checksum
        working-directory: dist
        run: shasum -a 256 -c gaugent-0.0.0-ci-local.dmg.sha256

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test release selection
        run: node --test website/release.test.mjs
      - name: Build static site container
        run: docker build -t gaugent-website:ci website
      - name: Verify website container
        run: |
          docker run -d --name website --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 gaugent-website:ci
          trap 'docker logs website; docker rm -f website' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsSI http://127.0.0.1:8080/script.mjs | grep -i 'content-type: application/javascript'
          curl -fsS http://127.0.0.1:8080/appcast.xml >/dev/null
